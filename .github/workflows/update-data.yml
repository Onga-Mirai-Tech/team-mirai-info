name: Update data

on:
  schedule:
    # 1時間ごと（毎時17分。Actions の混雑する00分を避ける）
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      window:
        description: '報道をさかのぼる期間（例: 7d, 30d, 1y）'
        required: false
        default: '7d'
  push:
    branches: [main]
    paths:
      - 'scripts/fetch.mjs'
      - 'config/sources.json'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch sources and build data/items.json
        env:
          GN_WINDOW: ${{ github.event.inputs.window || '7d' }}
        run: node scripts/fetch.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update data [skip ci]"
            # 別の実行が先に更新していた場合は、今回取得した内容を優先する
            # （取りこぼした分は次回の取得で再び拾われる）
            git pull --rebase -X theirs origin main
            git push
          fi
